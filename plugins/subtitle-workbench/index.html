<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕工坊</title><style>
:root{color-scheme:dark;--ink:#141519;--panel:#202126;--line:#3b3d45;--paper:#f4f1ea;--amber:#efb64c;--muted:#a9a9a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#3d3321,transparent 28rem),var(--ink);color:var(--paper);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1300px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}h1{margin:4px 0 18px;font-size:36px}.eyebrow{color:var(--amber);font:11px ui-monospace,monospace;letter-spacing:.14em}.status,.legend{color:var(--muted);font:12px/1.6 ui-monospace,monospace}.grid{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.tools{padding:12px;display:flex;flex-wrap:wrap;gap:7px}.tools+textarea{border-top:1px solid var(--line)}button,input{background:#292a2f;border:1px solid #66532e;color:var(--paper);border-radius:7px;padding:8px;font:12px ui-monospace,monospace}button:disabled{opacity:.45}textarea{width:100%;min-height:340px;resize:vertical;background:#18191d;color:var(--paper);border:0;padding:15px;font:13px/1.55 ui-monospace,monospace}.side{padding:16px}.finding{margin:6px 0;padding:8px;border-left:2px solid var(--amber);background:#18191d;font:12px ui-monospace,monospace}label{font:11px ui-monospace,monospace;color:var(--muted)}label input{display:block;width:82px;margin-top:4px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}@media(max-width:720px){.app{padding:16px}.head{display:block}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">LOCAL CUT ROOM / V0.1</div><h1>字幕工坊</h1></div><p class="status" id="status">本地授权打开字幕或媒体；不会上传内容。</p></header><section class="grid"><article class="card"><div class="tools"><button id="open">打开文件</button><button id="qc" disabled>质检</button><button id="srt" disabled title="VTT 转 SRT 会规范化并丢弃专属文档块">保存 SRT</button><button id="vtt" disabled>保存 VTT</button><button id="extract" disabled>提取音轨</button><button id="cancel" disabled>取消音轨</button><button id="transcribe">转写能力</button></div><div class="tools"><label>查找<input id="find"></label><label>替换<input id="replace"></label><button id="replaceAll" disabled>全部替换</button><label>平移 ms<input id="shift" value="500" type="number"></label><button id="shiftGo" disabled>平移</button><label>速度<input id="speed" value="1" type="number" step=".01"></label><button id="speedGo" disabled>速度</button><label>源 FPS<input id="fromFps" value="24" type="number"></label><label>目标 FPS<input id="toFps" value="25" type="number"></label><button id="fpsGo" disabled>FPS</button></div><textarea id="text" disabled placeholder="打开 SRT/VTT 后编辑。"></textarea></article><aside class="card side"><h2>QC 检片</h2><div class="tools"><label>最短 ms<input id="min" min="0" value="500" type="number"></label><label>最长 ms<input id="max" min="1" value="8000" type="number"></label><label>最大 CPS<input id="cps" min="0.1" value="22" type="number"></label></div><div id="findings" class="legend">尚未加载。</div><h2>外部能力</h2><div id="capabilities" class="legend"></div></aside></section></main><script>
const api=window.subtitleWorkbench,text=document.querySelector('#text'),status=document.querySelector('#status'),findings=document.querySelector('#findings'),subIds=['qc','srt','vtt','replaceAll','shiftGo','speedGo','fpsGo'];let grant=null,media=null,format='srt',name='subtitle',jobId=null,timer=null;const value=id=>document.querySelector('#'+id).value;const enable=v=>{text.disabled=!v;subIds.forEach(id=>document.querySelector('#'+id).disabled=!v)};const quality=()=>({minDuration:Number(value('min')),maxDuration:Number(value('max')),maxCharsPerSecond:Number(value('cps'))});function render(items){findings.replaceChildren();if(!items.length){const n=document.createElement('div');n.className='finding';n.textContent='镜头通过。';findings.append(n)}for(const item of items){const n=document.createElement('div');n.className='finding';n.textContent='#'+(item.index+1)+' · '+item.code;findings.append(n)}}function qc(){try{const r=api.analyze(text.value,format,quality());render(r.findings);status.textContent='已检查 '+r.cues.length+' 条字幕。'}catch(e){status.textContent='质检失败：'+e.message}}async function consume(r){if(!r||!r.ok)return;grant=r.file.grantId;name=r.file.name;if(r.file.type==='media'){media=grant;enable(false);document.querySelector('#extract').disabled=false;status.textContent='媒体已授权，未读取。';return}media=null;document.querySelector('#extract').disabled=true;const loaded=await api.readGrantedSubtitle(grant);format=loaded.format;text.value=loaded.content;enable(true);qc()}document.querySelector('#open').onclick=async()=>{try{await consume(await api.chooseInput())}catch(e){status.textContent=e.message}};document.querySelector('#qc').onclick=qc;document.querySelector('#replaceAll').onclick=()=>{const from=value('find');if(from){text.value=text.value.split(from).join(value('replace'));qc()}};for(const [id,op]of[['shiftGo',()=>({type:'shift',milliseconds:Number(value('shift'))})],['speedGo',()=>({type:'speed',speed:Number(value('speed'))})],['fpsGo',()=>({type:'fps',sourceFps:Number(value('fromFps')),targetFps:Number(value('toFps'))})]])document.querySelector('#'+id).onclick=()=>{try{text.value=api.transform(text.value,format,op());qc()}catch(e){status.textContent=e.message}};for(const [id,out]of[['srt','srt'],['vtt','vtt']])document.querySelector('#'+id).onclick=async()=>{try{const content=api.transform(text.value,format,{type:'shift',milliseconds:0,format:out});const r=await api.saveSubtitle(content,out,name);status.textContent=r.canceled?'已取消':'已保存 '+r.fileName}catch(e){status.textContent=e.message}};document.querySelector('#extract').onclick=async()=>{try{const r=await api.startAudioExtract(media);if(!r.ok){status.textContent=r.code;return}jobId=r.jobId;document.querySelector('#cancel').disabled=!r.cancelSupported;status.textContent='音轨提取运行中。';timer=setInterval(()=>{const j=api.audioJobStatus(jobId);if(['completed','failed','canceled','unknown'].includes(j.state)){clearInterval(timer);timer=null;document.querySelector('#cancel').disabled=true;status.textContent=j.state==='completed'?'音轨提取完成。':j.state==='canceled'?'音轨提取已取消。':j.state==='failed'?'音轨提取失败：'+j.message:'音轨任务已结束。'}},500)}catch(e){status.textContent=e.message}};document.querySelector('#cancel').onclick=async()=>{const r=await api.cancelAudio(jobId);status.textContent=r.ok?'已请求取消。':r.code};document.querySelector('#transcribe').onclick=async()=>{const r=await api.startTranscription();status.textContent=r.message||r.code};const cap=api.getCapabilities();document.querySelector('#capabilities').textContent='FFmpeg：'+(cap.ffmpeg?'宿主可用':'未提供')+'；Whisper：不探测 PATH。';consume(api.consumeEntry());const watch=setInterval(async()=>{const e=api.consumeEntry();if(e.ok){clearInterval(watch);await consume(e)}},500);
</script></body></html>
