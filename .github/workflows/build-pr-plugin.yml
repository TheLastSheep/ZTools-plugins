name: Build PR Plugin Package

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: '要构建的 PR 编号'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-plugin-build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  build-pasteboardpro-helper:
    runs-on: macos-14
    steps:
      - name: Checkout PR code
        env:
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head"
          git checkout --force FETCH_HEAD

      - name: Detect PasteboardPro helper requirement
        id: helper
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api --paginate "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' | grep -q '^plugins/pasteboard-pro/'; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
          else
            echo "required=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Vision helper
        if: steps.helper.outputs.required == 'true'
        run: |
          plugins/pasteboard-pro/apps/ztools/native/vision-helper/build.sh
          codesign --force --sign - plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision
          codesign --verify --strict plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision
          node plugins/pasteboard-pro/apps/ztools/scripts/attest-vision-helper.mjs \
            plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision \
            --signature=adhoc \
            --output=plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision-attestation.json

      - name: Upload Vision helper
        if: steps.helper.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pasteboardpro-vision-pr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
          path: |
            plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision
            plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision-attestation.json
          if-no-files-found: error
          retention-days: 3

  build-pr-plugin:
    needs: build-pasteboardpro-helper
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'

          const eventName = process.env.EVENT_NAME
          const outputPath = process.env.GITHUB_OUTPUT
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          }

          if (process.env.GH_TOKEN) {
            headers.Authorization = `Bearer ${process.env.GH_TOKEN}`
          }

          let pullRequest

          if (eventName === 'pull_request') {
            const eventPath = process.env.GITHUB_EVENT_PATH
            if (!eventPath) {
              throw new Error('GITHUB_EVENT_PATH is required for pull_request events')
            }
            const event = JSON.parse(readFileSync(eventPath, 'utf8'))
            pullRequest = event.pull_request
          } else {
            const prNumber = process.env.INPUT_PR_NUMBER
            if (!prNumber) {
              throw new Error('workflow_dispatch requires pr_number')
            }
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/pulls/${prNumber}`, { headers })
            if (!response.ok) {
              throw new Error(`Failed to fetch PR metadata: ${response.status} ${response.statusText} ${await response.text()}`)
            }
            pullRequest = await response.json()
          }

          const outputs = {
            number: String(pullRequest.number),
            head_sha: pullRequest.head.sha,
          }

          appendFileSync(
            outputPath,
            Object.entries(outputs)
              .map(([key, value]) => `${key}=${value}`)
              .join('\n') + '\n',
          )

          console.log(`Resolved PR #${outputs.number}`)
          console.log(`Head SHA: ${outputs.head_sha}`)
          NODE

      - name: Checkout PR code
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head"
          git checkout --force FETCH_HEAD
          git clean -ffdx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Detect changed plugins
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p release

          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs'

          const token = process.env.GH_TOKEN
          const repository = process.env.REPOSITORY
          const prNumber = process.env.PR_NUMBER
          const outputPath = process.env.GITHUB_OUTPUT
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          }

          if (token) {
            headers.Authorization = `Bearer ${token}`
          }

          const files = []
          for (let page = 1; ; page += 1) {
            const url = `https://api.github.com/repos/${repository}/pulls/${prNumber}/files?per_page=100&page=${page}`
            const response = await fetch(url, { headers })
            if (!response.ok) {
              throw new Error(`Failed to fetch PR files: ${response.status} ${response.statusText} ${await response.text()}`)
            }

            const pageFiles = await response.json()
            files.push(...pageFiles.map(file => file.filename))
            if (pageFiles.length < 100) {
              break
            }
          }

          const changedPlugins = [...new Set(
            files
              .map(file => file.match(/^plugins\/([^/]+)\//)?.[1])
              .filter(Boolean),
          )].sort()

          const hasChanges = changedPlugins.length > 0
          const buildInfo = {
            hasChanges,
            releaseVersion: `pr-${prNumber}`,
            changedPlugins,
            buildAll: false,
          }

          writeFileSync('release/build-info.json', JSON.stringify(buildInfo, null, 2))
          appendFileSync(outputPath, `has_changes=${hasChanges ? 'true' : 'false'}\n`)
          appendFileSync(outputPath, `changed_plugins=${changedPlugins.join(',')}\n`)

          if (hasChanges) {
            console.log(`Changed plugins: ${changedPlugins.join(', ')}`)
          } else {
            console.log('No plugin changes detected.')
          }
          NODE

          cat release/build-info.json

      - name: Setup Node.js 24 for PasteboardPro
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm 11 for PasteboardPro
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Download PasteboardPro Vision helper
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        uses: actions/download-artifact@v4
        with:
          name: pasteboardpro-vision-pr-${{ steps.pr.outputs.number }}
          path: plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist

      - name: Restore Vision helper executable bit
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        run: |
          chmod +x plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision
          test -f plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision-attestation.json

      - name: Verify PasteboardPro workspace
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        working-directory: plugins/pasteboard-pro
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm --filter @pasteboard-pro/atools typecheck
          pnpm --filter @pasteboard-pro/ztools typecheck
          pnpm typecheck:visual
          pnpm test:contract
          pnpm test:release-archive
          pnpm test:visual-artifact
          pnpm test:visual-contract
          node apps/atools/scripts/verify-source.mjs
          node apps/ztools/scripts/verify-package.mjs
          pnpm test
          pnpm benchmark:search

      - name: Upload PasteboardPro performance report
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        uses: actions/upload-artifact@v4
        with:
          name: pasteboardpro-performance-pr-${{ steps.pr.outputs.number }}
          path: plugins/pasteboard-pro/artifacts/pasteboardpro/search-performance.json

      - name: Install PasteboardPro visual test browser
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        working-directory: plugins/pasteboard-pro
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture PasteboardPro dual-host visual matrix
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        working-directory: plugins/pasteboard-pro
        run: |
          pnpm test:visual
          pnpm verify:visual-artifact

      - name: Upload PasteboardPro visual evidence
        if: always() && contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        uses: actions/upload-artifact@v4
        with:
          name: pasteboardpro-visual-pr-${{ steps.pr.outputs.number }}
          path: |
            plugins/pasteboard-pro/artifacts/pasteboardpro/visual-matrix
            plugins/pasteboard-pro/artifacts/pasteboardpro/playwright-report.json
            plugins/pasteboard-pro/artifacts/pasteboardpro/playwright-results
          if-no-files-found: error

      - name: Install root dependencies
        if: steps.detect.outputs.has_changes == 'true'
        run: npm ci

      - name: Build changed plugins
        if: steps.detect.outputs.has_changes == 'true'
        run: node scripts/build-plugins.js

      - name: Verify final PasteboardPro release archive
        if: contains(steps.detect.outputs.changed_plugins, 'pasteboard-pro')
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find release -maxdepth 1 -type f -name 'pasteboard-pro-*.zip' -print -quit)"
          test -n "${archive}"
          node plugins/pasteboard-pro/scripts/verify-release-archive.mjs \
            "${archive}" \
            --helper-attestation=plugins/pasteboard-pro/apps/ztools/native/vision-helper/dist/pasteboard-vision-attestation.json \
            --require-helper-signature=adhoc \
            --report=release/pasteboardpro-archive-verification.json

      - name: Upload plugin packages
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ steps.pr.outputs.number }}-plugin-packages
          path: |
            release/*.zip
            release/build-info.json
            release/pasteboardpro-archive-verification.json
            release/latest
          if-no-files-found: error
          retention-days: 14
