<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Sanitizer</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><p class="eyebrow">LOCAL REVIEW DESK</p><h1>Share Sanitizer</h1></div><div id="status" role="status">Ready</div></header><section class="grid"><div class="panel source"><label for="input">Sensitive draft</label><textarea id="input" maxlength="1048576" placeholder="Paste text before sharing…"></textarea><div class="controls"><button id="scan">Scan draft</button><button id="redact" class="danger">Apply redaction</button><button id="copy" class="secondary">Copy safe text</button></div><label class="file">Load image <input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><p id="ocr" class="hint"></p></div><aside class="panel findings"><h2>Risk rail</h2><div id="summary">No findings yet.</div><ol id="findings"></ol><label for="whitelist">Approved values (one per line)</label><textarea id="whitelist" rows="4" maxlength="20000" placeholder="example@company.com"></textarea></aside></section><section id="imageDesk" class="panel image-desk" hidden><h2>Image redaction canvas</h2><p>Drag on the image to add permanent masks. Exporting re-encodes pixels and strips metadata.</p><canvas id="canvas"></canvas><div class="controls"><button id="exportImage">Export re-encoded image</button><button id="clearMasks" class="secondary">Clear masks</button></div></section></main><script type="module" src="./app.mjs"></script></body></html>
